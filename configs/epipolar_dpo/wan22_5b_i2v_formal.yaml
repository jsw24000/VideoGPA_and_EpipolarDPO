experiment:
  name: wan22_5b_i2v_epipolar_dpo_formal
  output_subdir: epipolar_dpo/wan22_5b_i2v/formal

project:
  method: epipolar_dpo
  model_family: wan2.2
  model_scale: 5b
  task: i2v
  run_type: formal

source:
  method: videogpa
  run_relpath: videogpa/wan22_5b_i2v/formal/wan22_5b_i2v_formal_001
  candidate_manifest_relpath: manifests/candidate_groups.json
  expected_groups: 3147
  expected_candidates: 3
  expected_candidates_per_group: 3
  expected_candidate_videos: 9441
  candidate_seeds: [1001, 1002, 1003]

paths:
  videogpa_relpath: VideoGPA
  wan_source_relpath: third_party/Wan2.2

model:
  model_relpath: wan/Wan2.2-TI2V-5B
  vggt_model_relpath: vggt/VGGT-1B
  wan_task_key: ti2v-5B
  architecture: single_ti2v_5b
  vae_version: wan2_2

data:
  manifest_relpath: manifests/videogpa_protocol/train_i2v.json
  master_manifest_relpath: manifests/master_all.jsonl
  first_frames_relroot: first_frames
  required_split: train
  required_buckets: [8k, 9k, 10k, 11k]
  subset_size: all
  subset_seed: 2026
  camera_prompt_seed: 2026
  candidates_per_prompt: 3
  candidate_seeds: [1001, 1002, 1003]

generation:
  frame_num: 81
  size: "1280*704"
  fps: 24

scoring:
  metric_name: epipolar_consistency
  metric_mode: min
  min_score_gap: 0.0
  winner_score_threshold: 8.0
  smoke_fallback_if_no_pairs: false
  epipolar:
    implementation: Epipolar-DPO.metrics.video_evaluation.epipolar.EpipolarEvaluator
    sampling_rate: 15
    descriptor_type: sift
    ratio_thresh: 0.75
    ransac_thresh: 1.0
    min_matches: 20
  motion:
    implementation: Epipolar-DPO.metrics.video_evaluation.dynamics.DynamicsEvaluator
    sampling_rate: 1
    multichannel: true

motion_filter:
  enabled: true
  metric_name: motion_dynamics
  max_motion_dynamics: 0.9
  min_motion_dynamics: null
  threshold_source: Epipolar-DPO/model_training/reward_lora/dataset.py MOTION_THRESHOLD

encoding:
  dtype: bfloat16
  overwrite: false
  num_frames: 81
  latent_provenance: posthoc_mp4_vae
  condition_schema: [encoder_hidden_states, image_latent]

training:
  loss_strategy: epipolar_dpo
  max_train_steps: 10000
  save_steps: 1000
  batch_size_per_gpu: 1
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-6
  warmup_steps: 500
  lora_rank: 64
  lora_alpha: 128.0
  lora_dropout: 0.0
  lora_target_modules: [q, k, v, o]
  dpo_beta: 500.0
  seed: 2026
  resume: auto
  num_workers: 0
  gradient_clip_val: 1.0
  num_train_timesteps: 1000
  shift: 5.0
  enable_gradient_checkpointing: true
  device: 0

formal_requirements:
  expected_train_prompts: 3147
  expected_candidate_videos: 9441
  expected_candidate_groups: 3147
  expected_candidates_per_group: 3
  note: "I2V source videos may be 1248x704 even though the nominal size is 1280*704; source validation checks decodability, frame count, fps, and VAE-compatible dimensions rather than exact width."
