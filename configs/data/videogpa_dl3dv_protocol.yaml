train_subsets:
  - 8K
  - 9K
  - 10K
  - 11K

test_subsets:
  - 1K

caption_dir: VideoGPA/dl3dv_video_captions
hf_dataset: DL3DV/DL3DV-ALL-960P
random_seed: 2026

t2v:
  train_prompt: natural_vlm_caption
  test_prompt: natural_vlm_caption
  append_scripted_camera_motion: false

i2v:
  train_prompt: official_scripted_camera_prompt
  test_prompt: natural_vlm_caption
  first_frame_required: true

outputs:
  caption_index_relpath: caption_index.jsonl
  first_frames_relpath: first_frames.jsonl
  master_train_relpath: master_train.jsonl
  master_test_relpath: master_test.jsonl
  master_all_relpath: master_all.jsonl
  videogpa_protocol_relpath: videogpa_protocol
  shared_protocol_relpath: shared_protocol
