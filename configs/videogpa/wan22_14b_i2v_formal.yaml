experiment:
  name: wan22_14b_i2v_formal
  output_subdir: videogpa/wan22_14b_i2v/formal

project:
  method: videogpa
  model_family: wan2.2
  model_scale: 14b
  task: i2v
  run_type: formal

paths:
  videogpa_relpath: VideoGPA
  wan_source_relpath: third_party/Wan2.2

model:
  model_relpath: wan/Wan2.2-I2V-A14B
  vggt_model_relpath: vggt/VGGT-1B
  wan_task_key: i2v-A14B
  architecture: dual_expert_a14b
  vae_version: wan2_1

data:
  manifest_relpath: manifests/videogpa_protocol/train_i2v.json
  master_manifest_relpath: manifests/master_all.jsonl
  first_frames_relroot: first_frames
  required_split: train
  required_buckets: [8k, 9k, 10k, 11k]
  subset_size: all
  subset_seed: 2026
  camera_prompt_seed: 2026
  candidates_per_prompt: 3
  candidate_seeds: [1001, 1002, 1003]

generation:
  frame_num: 81
  size: "1280*720"
  max_area: 921600
  sampling_steps: 40
  guide_scale: [3.5, 3.5]
  sample_shift: 5.0
  sample_solver: unipc
  fps: 16
  offload_model: false
  convert_model_dtype: true
  t5_cpu: false

scoring:
  num_sampled_frames: 10
  conf_threshold: 0
  metric_name: consistency_score
  metric_mode: min
  motion_threshold: 0.001
  min_score_gap: 0.05
  winner_score_threshold: 0.8
  smoke_fallback_if_no_pairs: false

encoding:
  dtype: bfloat16
  overwrite: false
  num_frames: 81

training:
  max_train_steps: 10000
  save_steps: 1000
  batch_size_per_gpu: 1
  gradient_accumulation_steps: 2
  learning_rate: 5.0e-6
  warmup_steps: 500
  lora_rank: 64
  lora_alpha: 128.0
  lora_dropout: 0.0
  lora_target_modules: [q, k, v, o]
  dpo_beta: 1.0
  seed: 2026
  resume: auto
  num_workers: 0
  gradient_clip_val: 1.0
  num_train_timesteps: 1000
  shift: 5.0
  enable_gradient_checkpointing: true
  device: 0

formal_requirements:
  expected_train_prompts: 3147
  expected_candidate_videos: 9441
  note: "Wan2.2 A14B I2V follows input-image aspect ratio with max_area=1280*720. Set GPU_IDS to one distributed worker group."
